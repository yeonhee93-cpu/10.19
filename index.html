<!doctype html>
<html lang="ko" data-theme="museum">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시화전 온라인 전시관</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Noto+Sans+KR:wght@300;400;500;700;800&family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   테마 3종 — 상단 스위치로 전환
   A. museum : 고급 미술관 (아이보리, 액자 매트, 세리프)
   B. maison : 명품 브랜드 (흑백, 여백, 대문자 라틴)
   C. night  : 애플뮤직 (다크, 블러 배경, 가사형 하이라이트)
   ========================================================= */
:root{--ease:cubic-bezier(.2,.7,.2,1)}
[data-theme=museum]{
  --bg:#f3eee5;--surface:#faf7f1;--ink:#1f1c18;--muted:#7b7366;--line:#d8cfbf;--accent:#8b5e34;--mat:#fffdf8;
  --display:'Noto Serif KR',serif;--body:'Noto Sans KR',sans-serif;--latin:'Cormorant Garamond',serif;
  --radius:2px;--card-shadow:0 1px 2px rgba(60,40,20,.08),0 18px 36px -16px rgba(60,40,20,.32);--blur-op:0;--shade:transparent;
}
[data-theme=maison]{
  --bg:#ffffff;--surface:#ffffff;--ink:#0a0a0a;--muted:#737373;--line:#e6e6e6;--accent:#0a0a0a;--mat:#f5f5f3;
  --display:'Noto Serif KR',serif;--body:'Noto Sans KR',sans-serif;--latin:'Cormorant Garamond',serif;
  --radius:0px;--card-shadow:none;--blur-op:0;--shade:transparent;
}
[data-theme=night]{
  --bg:#0b0b0e;--surface:#1a1a20;--ink:#f4f4f6;--muted:#8f8f99;--line:#2a2a31;--accent:#ff4d64;--mat:#16161b;
  --display:'Noto Sans KR',sans-serif;--body:'Noto Sans KR',sans-serif;--latin:'Cormorant Garamond',serif;
  --radius:14px;--card-shadow:0 24px 48px -24px rgba(0,0,0,.9);--blur-op:.8;--shade:rgba(0,0,0,.45);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased;
  transition:background-color .6s var(--ease),color .6s var(--ease);padding-bottom:120px}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.gutter{padding-inline:clamp(16px,4vw,56px)}

/* ---------- 상단 바 ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px clamp(16px,4vw,56px);background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.brand{font-family:var(--latin);font-size:14px;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-shrink:0}
.switch button{font-size:12px;padding:6px 12px;border-radius:999px;color:var(--muted);white-space:nowrap;transition:.25s}
.switch button b{font-weight:600}
.switch button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
[data-theme=maison] .switch,[data-theme=maison] .switch button{border-radius:0}
@media (max-width:540px){.switch .lbl{display:none}.switch button{padding:6px 11px}}

/* ---------- 히어로 ---------- */
.hero{padding-block:clamp(64px,12vw,160px) clamp(40px,7vw,96px);text-align:center;max-width:1100px;margin:0 auto}
.eyebrow{font-family:var(--latin);letter-spacing:.3em;text-transform:uppercase;font-size:13px;color:var(--accent)}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(23px,6.2vw,64px);line-height:1.2;letter-spacing:-.02em;margin:22px 0 24px;white-space:nowrap}
.hero .la:empty{display:none}
.hero .la{display:block;font-family:var(--latin);font-style:italic;font-weight:400;font-size:.3em;letter-spacing:.02em;color:var(--muted);margin-top:14px}
.lead .sent{display:block;text-wrap:balance}
.lead{max-width:760px;margin:0 auto;color:var(--muted);font-size:clamp(15px,1.6vw,17px);word-break:keep-all}
.facts{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 28px;margin-top:36px;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:500;margin-right:6px}
.facts i{font-style:normal}
@media (max-width:640px){
  .facts{display:grid;grid-template-columns:auto auto;justify-content:center;gap:10px 14px;text-align:left;font-size:13.5px;margin-top:30px}
  .facts span{display:contents}
  .facts b{margin:0;white-space:nowrap}
  .facts i{word-break:keep-all}
  .facts .paren{display:block;white-space:nowrap;margin-top:2px}
}
[data-theme=maison] .hero h1{font-weight:300;letter-spacing:.1em}
[data-theme=maison] .hero .la{font-style:normal;text-transform:uppercase;letter-spacing:.4em;font-size:.18em;margin-top:22px}
[data-theme=maison] .eyebrow{color:var(--muted);font-family:var(--body);font-size:11px;letter-spacing:.4em}
[data-theme=night] .hero{text-align:left;max-width:1280px}
[data-theme=night] .hero h1{font-weight:800;letter-spacing:-.045em}
[data-theme=night] .hero .la{font-family:var(--body);font-style:normal;font-weight:500;letter-spacing:0}
[data-theme=night] .lead{margin:0}
[data-theme=night] .facts{justify-content:flex-start}

/* ---------- 툴바 ---------- */
.toolbar{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;
  padding-block:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 15px;font-size:13px;border:1px solid var(--line);border-radius:999px;color:var(--muted);transition:.25s}
.chip small{opacity:.6;margin-left:4px;font-size:11px}
.chip[aria-pressed=true]{border-color:var(--ink);color:var(--ink)}
[data-theme=maison] .chip{border-radius:0;letter-spacing:.08em}
[data-theme=maison] .chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.jump{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ink);padding:4px 2px}
.jump input{width:130px;background:none;border:0;outline:0;font:inherit;font-size:14px;color:var(--ink)}
.jump input::placeholder{color:var(--muted)}
.jump button{font-size:13px;font-weight:500}

/* ---------- 작품 그리드 ---------- */
.gallery{max-width:1280px;margin:0 auto;padding-block:clamp(56px,8vw,104px) 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:clamp(36px,4.5vw,64px) clamp(20px,3vw,40px)}
.part{padding-bottom:clamp(80px,11vw,150px)}
.part + .part{padding-top:clamp(64px,9vw,120px);border-top:1px solid var(--line)}
.part-head{max-width:940px;margin:0 auto clamp(44px,6vw,72px);text-align:center}
.part-no{font-family:var(--latin);font-size:14px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
.part-title{font-family:var(--display);font-weight:500;font-size:clamp(28px,4.2vw,46px);line-height:1.25;margin:14px 0 22px;word-break:keep-all}
.part-desc{color:var(--muted);font-size:clamp(14.5px,1.5vw,16px);line-height:1.9;word-break:keep-all}
.part-desc .sent,.anth-desc .sent{display:block;text-wrap:balance}
.anth-desc .sent + .sent{margin-top:6px}
h1,h2,h3,.part-title,.sub-title,.lb-title,.v-title{text-wrap:balance}
p,.v-note,.g-text,.lb-desc,.vn-list p,.gadmin li p{text-wrap:pretty}
.sub-sub{margin-top:-4px;font-size:14px;color:var(--muted);letter-spacing:.02em}
.part-desc .sent + .sent{margin-top:2px}
.nm{white-space:nowrap}
.part-count{margin-top:22px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
.part-count::before,.part-count::after{content:'';display:inline-block;width:28px;height:1px;background:var(--line);vertical-align:middle;margin:0 12px}
.meta .online-tag{display:inline-block;margin-top:8px;padding:2px 10px;border:1px solid var(--line);border-radius:999px;font-size:11.5px;letter-spacing:.04em;color:var(--accent)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:32px 0}
.sub-head{max-width:640px;margin:clamp(8px,2vw,24px) auto clamp(36px,5vw,56px);text-align:center}
.sub-head{max-width:940px}
.anth-head{margin-top:clamp(72px,10vw,120px)}
.sub-title{font-family:var(--display);font-weight:500;font-size:clamp(22px,2.8vw,30px);margin-bottom:14px;word-break:keep-all}
.sub-credit{margin-top:12px;font-size:13px;color:var(--muted)}
.extra-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:clamp(28px,4vw,52px) clamp(16px,2.4vw,32px)}
@media (max-width:540px){.extra-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.anthology{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center;max-width:900px;margin:0 auto}
.anth-img img{max-width:100%;padding:clamp(10px,4%,18px);background:var(--mat);border-radius:var(--radius);box-shadow:var(--card-shadow);transition:transform .5s var(--ease)}
.anth-img:hover img{transform:translateY(-4px)}
.shop{margin-top:28px;padding:22px 24px;background:var(--surface);border:1px solid var(--line);border-radius:4px;text-align:left}
.shop-label{font-size:12px;letter-spacing:.14em;color:var(--accent)}
.shop-name{margin-top:6px;font-size:16px;word-break:keep-all}
.shop-name b{font-family:var(--display);font-weight:500}
.shop-note{margin-top:6px;font-size:13.5px;color:var(--muted);word-break:keep-all}
.shop dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:14px;font-size:14px}
.shop dt{color:var(--muted)}
.shop dd{word-break:keep-all}
.shop dd a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.shop-map{margin-top:16px}
.anth-desc{color:var(--muted);font-size:clamp(14.5px,1.5vw,16px);line-height:1.9;word-break:keep-all}
@media (max-width:640px){.anth-text{width:100%}.anthology{grid-template-columns:1fr;justify-items:center;text-align:center}.anth-img{max-width:240px}}
.guest{max-width:1280px;margin:0 auto;padding-block:clamp(72px,10vw,128px);border-top:1px solid var(--line)}
.gform{max-width:760px;margin:0 auto;padding:clamp(20px,3vw,32px);background:var(--mat);border:1px solid var(--line);box-shadow:var(--card-shadow);border-radius:4px;display:grid;gap:16px}
.g-field{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.g-field em{font-style:normal;opacity:.7}
.g-field textarea,.g-field input,.g-field select{font:inherit;font-size:15.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:11px 13px;width:100%;min-width:0}
.g-field textarea{font-family:var(--display);line-height:1.8;resize:vertical;min-height:120px}
.g-field textarea:focus,.g-field input:focus,.g-field select:focus{outline:none;border-color:var(--ink)}
.g-msg{position:relative}
.g-count{position:absolute;right:10px;bottom:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.g-row{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}
.g-help{font-size:12.5px;color:var(--muted);line-height:1.7;word-break:keep-all}
.g-submit{justify-self:center;padding:12px 28px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14.5px;letter-spacing:.04em}
.g-submit:disabled{opacity:.5}
.gwall{max-width:1180px;margin:clamp(48px,6vw,72px) auto 0;columns:4 230px;column-gap:22px}
.gnote{break-inside:avoid;margin:0 0 22px;padding:22px 20px 16px;background:var(--tint,#fffdf7);border:1px solid rgba(80,60,30,.08);box-shadow:0 1px 2px rgba(60,40,20,.06),0 10px 24px -14px rgba(60,40,20,.28);transform:rotate(var(--tilt,0deg));transition:transform .3s}
.gnote:hover{transform:rotate(0) translateY(-2px)}
.gnote.pending{border:1px dashed var(--accent);opacity:.92}
.g-wait{font-size:11.5px;color:var(--accent);margin-bottom:8px}
.g-text{font-family:var(--display);font-size:15.5px;line-height:1.85;white-space:pre-line;word-break:keep-all}
.g-foot{margin-top:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:12px;color:var(--muted)}
.g-name{color:var(--ink);font-weight:500}
.g-work{font-size:12px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.g-date{margin-left:auto}
.g-empty{text-align:center;color:var(--muted);font-size:14px;padding:24px 0;column-span:all}
.v-notes{margin-top:30px}
.v-notes .v-label b{color:var(--accent);font-weight:500;margin-left:4px}
.vn-list{display:grid;gap:10px;max-height:340px;overflow:auto;padding-right:4px}
.vn-list blockquote{margin:0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.vn-list p{font-family:var(--display);font-size:14.5px;line-height:1.8;white-space:pre-line;word-break:keep-all}
.vn-list cite{display:block;margin-top:6px;font-style:normal;font-size:12px;color:var(--muted)}
.vn-empty{font-size:13.5px;color:var(--muted)}
.vn-write{margin-top:14px}
.gadmin{max-width:960px;margin:32px auto 0;padding:20px 22px;border:2px solid var(--accent);border-radius:6px;background:var(--surface)}
.ga-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.ga-title{font-weight:600;color:var(--accent)}
.ga-help{font-size:13px;color:var(--muted);margin:6px 0 12px}
.ga-sub{margin:18px 0 8px;font-size:13px;color:var(--muted)}
.gadmin ul{list-style:none;display:grid;gap:8px}
.gadmin li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.gadmin li.is-on{background:var(--mat)}
.gadmin li p{font-size:14.5px;white-space:pre-line;word-break:keep-all}
.gadmin li small{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.gadmin li span{display:flex;gap:6px;flex-shrink:0}
.gadmin li button{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;background:var(--surface)}
.gadmin li button.ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gadmin li.none{color:var(--muted);font-size:13px}
@media (max-width:640px){.g-row{grid-template-columns:1fr}.gwall{columns:2 150px;column-gap:12px}.gnote{padding:16px 14px 12px;margin-bottom:12px}.g-text{font-size:14.5px}.g-date{margin-left:0}.gadmin li{flex-direction:column}}
.lb{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.lb[hidden]{display:none}
.lb-body{min-height:100%;max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(28px,5vw,80px);align-items:center;padding:84px clamp(64px,6vw,96px) 56px}
.lb figure{margin:0;display:flex;justify-content:center;align-self:start;position:sticky;top:84px}
.lb img{max-width:100%;max-height:calc(100vh - 150px);background:var(--mat);padding:clamp(8px,1.6vw,18px);box-shadow:var(--card-shadow)}
.lb-title{font-family:var(--display);font-weight:500;font-size:clamp(26px,3vw,40px);line-height:1.25;margin:14px 0 8px;word-break:keep-all}
.lb-desc{font-size:15.5px;line-height:1.95;white-space:pre-line;word-break:keep-all;text-align:justify}
.lb-voices{list-style:none;display:grid;gap:16px}
.lb-voices li{display:grid;grid-template-columns:64px 1fr;gap:12px;font-size:14.5px;line-height:1.8;word-break:keep-all;padding-left:14px;border-left:2px solid var(--line)}
.lb-voices b{font-weight:500;color:var(--accent)}
.lb-voices span{color:var(--muted);text-align:justify}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);z-index:2;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.lb-nav[hidden]{display:none}
.lb-nav svg{width:18px;height:18px}
.lb-nav.prev{left:clamp(8px,1.6vw,20px)}.lb-nav.next{right:clamp(8px,1.6vw,20px)}
.lb .v-close{position:fixed}
@media (max-width:860px){.lb-body{grid-template-columns:1fr;padding:72px 16px 96px;align-items:start}.lb figure{position:static}.lb img{max-height:62vh}
  .lb-nav{top:auto;bottom:16px;transform:none}.lb-nav.prev{left:calc(50% - 56px)}.lb-nav.next{right:calc(50% - 56px)}.lb-voices li{grid-template-columns:1fr;gap:2px}}
.card-btn{display:block;width:100%;text-align:left}
.frame{position:relative;aspect-ratio:1/1;display:flex;align-items:flex-end;justify-content:center;
  transition:transform .5s var(--ease),box-shadow .5s var(--ease)}

.frame img{max-width:100%;max-height:100%;width:auto;height:auto;padding:clamp(10px,7%,22px);background:var(--mat);border-radius:var(--radius);box-shadow:var(--card-shadow);transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
[data-theme=museum] .card-btn:hover .frame img{transform:translateY(-6px);box-shadow:0 2px 4px rgba(60,40,20,.08),0 30px 50px -20px rgba(60,40,20,.4)}
[data-theme=maison] .card-btn:hover .frame img{transform:scale(1.045)}
[data-theme=night] .card-btn:hover .frame{transform:scale(1.025)}
.hover-play{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.3s var(--ease);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.hover-play svg{width:20px;height:20px;margin-left:2px}
[data-theme=night] .card-btn:hover .hover-play,[data-theme=night] .card-btn:focus-visible .hover-play{opacity:1;transform:none}
.eq{position:absolute;left:12px;top:12px;display:none;gap:2px;align-items:flex-end;height:14px;padding:6px 7px;background:rgba(0,0,0,.55);border-radius:6px;box-sizing:content-box}
.card.playing .eq{display:flex}
.eq i{width:3px;height:4px;background:#fff;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.meta{padding-top:18px}
.meta .no{font-family:var(--latin);font-size:15px;letter-spacing:.12em;color:var(--accent)}
.meta h3{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.35;margin:4px 0 2px;word-break:keep-all}
.meta p{font-size:13px;color:var(--muted)}
[data-theme=museum] .meta{text-align:center}
[data-theme=maison] .meta .no{font-family:var(--body);font-size:11px;letter-spacing:.3em;color:var(--muted)}
[data-theme=maison] .meta h3{font-weight:400;font-size:17px;letter-spacing:.04em;margin-top:8px}
[data-theme=night] .meta{padding-top:12px}
[data-theme=night] .meta .no{font-family:var(--body);font-size:12px;letter-spacing:0;color:var(--muted)}
[data-theme=night] .meta h3{font-weight:700;font-size:15px;margin:0}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}

footer{max-width:1280px;margin:0 auto;padding-block:40px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

/* ---------- 작품 상세 뷰어 ---------- */
.viewer{position:fixed;inset:0;z-index:60;background:var(--bg);opacity:0;transition:opacity .4s var(--ease);overflow:hidden}
.viewer.open{opacity:1}
.v-bg{position:absolute;inset:-20%;background-size:cover;background-position:center;filter:blur(90px) saturate(1.6);opacity:var(--blur-op);transition:opacity .6s}
.v-shade{position:absolute;inset:0;background:var(--shade)}
.v-scroll{position:relative;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.v-inner{min-height:100%;max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
  gap:clamp(32px,6vw,96px);align-items:center;padding:88px clamp(16px,4vw,56px) 72px}
.v-art{display:flex;justify-content:center;align-self:start;position:sticky;top:88px}
.v-info{align-self:center}
.v-frame{max-width:100%;background:var(--mat);border-radius:var(--radius);box-shadow:var(--card-shadow);overflow:hidden}
[data-theme=museum] .v-frame{padding:clamp(12px,2.6vw,34px);box-shadow:0 2px 4px rgba(60,40,20,.08),0 40px 80px -30px rgba(60,40,20,.45)}
[data-theme=night] .v-frame{border-radius:18px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9)}
.v-frame img{max-width:100%;max-height:calc(100vh - 230px);width:auto;height:auto}
.v-frame.swap img{animation:swap .6s var(--ease)}
@keyframes swap{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.v-index{font-size:13px;letter-spacing:.06em;color:var(--muted)}
.v-index b{font-weight:500;color:var(--accent);margin-right:8px}
.v-no{font-family:var(--latin);font-size:clamp(52px,6vw,88px);line-height:1;color:var(--accent);font-weight:400;margin-top:10px}
.v-title{font-family:var(--display);font-size:clamp(28px,3.4vw,44px);font-weight:500;line-height:1.25;margin:16px 0 8px;word-break:keep-all}
.v-author{color:var(--muted);font-size:15px}
[data-theme=maison] .v-no{font-family:var(--body);font-size:12px;letter-spacing:.35em;color:var(--muted)}
[data-theme=maison] .v-title{font-weight:300;letter-spacing:.05em}
[data-theme=night] .v-no{display:none}
[data-theme=night] .v-title{font-weight:800;letter-spacing:-.03em}
.v-note{font-size:15.5px;line-height:1.95;word-break:keep-all;white-space:pre-line;text-align:justify;text-justify:inter-word;padding-left:18px;border-left:2px solid var(--line)}
.v-note:empty,#vNoteLabel[hidden]{display:none}
.listen{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 2px}
.lbtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;padding:7px 18px 7px 7px;border:1px solid var(--line);border-radius:999px;background:var(--surface);transition:border-color .2s,background .2s}
.lbtn:hover:not(:disabled){border-color:var(--ink)}
.lbtn[aria-pressed=true]{border-color:var(--ink)}
.lbtn:disabled{opacity:.38;cursor:default}
.lic{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex-shrink:0}
.lic svg{width:14px;height:14px}
.lbtn b{font-weight:500;font-size:14px}
.lbtn small{margin-left:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lpr{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--accent)}
.zbtn{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:rgba(20,18,16,.62);color:#fff;display:grid;place-items:center;opacity:.85;transition:opacity .2s}
.zbtn svg{width:17px;height:17px}
.v-frame{position:relative}
.v-frame img{cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:85;background:#11100e}
.zoom[hidden]{display:none}
.z-scroll{position:absolute;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;-webkit-overflow-scrolling:touch}
.z-scroll img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;user-select:none}
.zoom.big .z-scroll{display:block}
.zoom.big .z-scroll img{max-width:none;max-height:none;cursor:zoom-out}
.zoom .v-close{position:fixed;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.z-hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:12.5px;background:rgba(0,0,0,.45);padding:6px 14px;border-radius:999px;pointer-events:none;white-space:nowrap}
.lb figure img{cursor:zoom-in}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;margin-bottom:18px}
.seg button{padding:8px 16px;border-radius:999px;font-size:13.5px;color:var(--muted);transition:.2s}
.seg button small{margin-left:6px;font-size:11.5px;opacity:.7;font-variant-numeric:tabular-nums}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.35;cursor:default}
.tune{margin-top:16px;padding:12px 14px;border:1px dashed var(--accent);border-radius:6px;font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tune button{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px}
.tune[hidden]{display:none}
.tune b{font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.rule{height:1px;background:var(--line);margin:28px 0}
.poem{font-family:var(--display);font-size:clamp(17px,1.6vw,20px);line-height:2.05;word-break:keep-all}
.poem span{display:block;text-wrap:balance;padding-left:1.1em;text-indent:-1.1em;transition:opacity .6s var(--ease),color .6s var(--ease),transform .6s var(--ease);transform-origin:left center}
.is-live .poem span{opacity:.32}
.is-live .poem span.past{opacity:.6}
.is-live .poem span.on{opacity:1;color:var(--accent)}
[data-theme=maison] .is-live .poem span.on{color:var(--ink)}
[data-theme=night] .poem{font-weight:700;font-size:clamp(20px,2.3vw,30px);line-height:1.65;letter-spacing:-.02em}
[data-theme=night] .is-live .poem span{opacity:.25}
[data-theme=night] .is-live .poem span.past{opacity:.45}
[data-theme=night] .is-live .poem span.on{opacity:1;color:var(--ink);transform:scale(1.035)}
.v-label{font-size:12px;letter-spacing:.14em;color:var(--muted);margin-top:36px;margin-bottom:12px}
.controls{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.big-play{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;transition:transform .2s}
.big-play:active{transform:scale(.93)}
.big-play svg{width:26px;height:26px}
[data-theme=museum] .big-play{background:var(--ink);color:var(--bg)}
[data-theme=maison] .big-play{border-radius:0;background:var(--ink);color:var(--bg)}
.track{height:22px;display:flex;align-items:center;cursor:pointer}
.bar{position:relative;height:3px;width:100%;background:var(--line);border-radius:3px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--ink)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.v-actions{display:flex;gap:8px;margin-top:32px;flex-wrap:wrap}
.ghost{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--line);border-radius:999px;font-size:13px;transition:.2s}
.ghost:hover{border-color:var(--ink)}
.ghost svg{width:16px;height:16px}
[data-theme=maison] .ghost{border-radius:0}
.v-close{position:absolute;top:18px;right:clamp(16px,4vw,40px);z-index:3;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.v-close svg{width:18px;height:18px}
[data-theme=maison] .v-close{border-radius:0}
@media (max-width:860px){
  .v-inner{grid-template-columns:1fr;padding-top:76px;align-items:start;gap:32px}
  .v-art{position:static}
  .v-frame img{max-height:62vh}
}

/* ---------- 미니 플레이어 (애플뮤직 스타일) ---------- */
.mp{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));z-index:70;width:min(720px,calc(100% - 32px));
  transform:translate(-50%,170%);transition:transform .55s var(--ease);background:color-mix(in srgb,var(--surface) 78%,transparent);
  backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 24px 50px -20px rgba(0,0,0,.35);overflow:hidden}
.mp.show{transform:translate(-50%,0)}
body.lock .mp{transform:translate(-50%,170%)}
[data-theme=museum] .mp{border-radius:6px}
[data-theme=maison] .mp{border-radius:0;box-shadow:none;border-color:var(--ink)}
.mp-row{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px}
.mp-info{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.mp-info img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0;background:var(--mat)}
[data-theme=maison] .mp-info img{border-radius:0}
.mp-text{min-width:0}
.mp-text b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-text span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-ctrl{display:flex;align-items:center}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;transition:background .2s}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.mp-track{height:4px;background:var(--line);cursor:pointer}
.mp-fill{height:100%;width:0;background:var(--accent)}

.toast{position:fixed;left:50%;bottom:110px;z-index:90;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;transition:.35s var(--ease);max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
[data-theme=maison] .toast{border-radius:0}


/* ---------- 휴대폰 화면 ---------- */
@media (max-width:860px){
  .v-info{display:flex;flex-direction:column}
  .v-info > *{order:2}
  .v-index,.v-no,.v-title,.v-author{order:0}
  .listen{order:1;position:sticky;top:0;z-index:2;background:var(--bg);margin:16px -16px 0;padding:10px 64px 10px 16px;border-bottom:1px solid var(--line)}
  .listen{flex-wrap:nowrap;gap:8px}
  .lbtn{padding:5px 12px 5px 5px;gap:7px}
  .lic{width:28px;height:28px}
  .lbtn b{font-size:13px}
  .lbtn small{margin-left:5px;font-size:11px}
  .listen .seg{margin-bottom:10px}
  .listen .big-play{width:52px;height:52px}
  .v-no{font-size:44px}
  .v-title{margin-top:8px}
  .poem{font-size:17px;line-height:1.95}
}
.m-br{display:none}
.mp:not(.show){visibility:hidden}
@media (max-width:640px){
  .m-br{display:inline}
  .t-sep{display:none}
  .v-note,.lb-desc,.lb-voices li,.vn-list p,.g-text{word-break:keep-all;overflow-wrap:anywhere;line-break:strict;hyphens:none}
  .v-note{padding-left:12px;font-size:15px;line-height:1.9;text-align:justify}
  .lb-desc{font-size:15px;line-height:1.9}
  .lb-voices li{font-size:14px;line-height:1.8}
  .v-note,.lb-desc,.lb-voices span{text-wrap:wrap;letter-spacing:-.01em}
  .lb-voices li{padding-left:10px}
}
@media (max-width:540px){
  .chips{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding:2px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;flex-shrink:0}
  .toolbar{gap:12px}
  .jump{width:100%}
  .jump input{flex:1;width:auto}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 14px}
  .meta{padding-top:12px}
  .meta .no{font-size:13px}
  .meta h3{font-size:15.5px}
  .meta p{font-size:12px}
  .frame img{padding:7px}
  .eyebrow{letter-spacing:.18em;font-size:11px}
  .part-title{font-size:26px}
  .seg button{padding:7px 13px;font-size:13px}
}

/* ---------- 오프닝 ---------- */
.intro{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--bg);
  background-image:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(120,90,50,.10) 100%);
  clip-path:inset(0 0 0 0);transition:clip-path 1.25s cubic-bezier(.77,0,.18,1)}
.intro::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .38 0 0 0 0 .28 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.in-inner{position:relative;z-index:1;text-align:center;padding:0 16px;transition:opacity .9s ease,transform 1.2s cubic-bezier(.77,0,.18,1)}
.in-rule{display:block;width:1px;height:0;margin:0 auto 30px;background:var(--ink);animation:inRule 1s cubic-bezier(.6,0,.2,1) .2s forwards}
.in-eyebrow{font-family:var(--body);font-size:clamp(11px,1.1vw,13px);letter-spacing:.6em;color:var(--muted);opacity:0;animation:inEyebrow 1.6s cubic-bezier(.2,.7,.2,1) .6s forwards;padding-left:.32em}
.in-title{font-family:var(--display);font-weight:500;font-size:clamp(30px,6.4vw,84px);line-height:1.25;letter-spacing:-.01em;margin:26px 0 0;white-space:nowrap;color:var(--ink)}
.in-title .ch{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(.28em);animation:inChar 1.25s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(1.05s + var(--i) * 72ms)}
.in-title .sp{display:inline-block;width:.32em}
.in-br{display:none}
.in-mark{display:block;width:0;height:1px;margin:30px auto 0;background:#9c3b30;animation:inMark 1.1s cubic-bezier(.6,0,.2,1) 2.55s forwards}
.in-sub{margin-top:18px;font-family:var(--display);font-size:clamp(13px,1.3vw,16px);color:var(--muted);letter-spacing:.08em;opacity:0;animation:inFade 1.2s ease 2.95s forwards}
.in-skip{position:absolute;right:clamp(16px,3vw,32px);bottom:calc(clamp(16px,3vw,28px) + env(safe-area-inset-bottom));z-index:2;font-size:12px;letter-spacing:.18em;color:var(--muted);padding:8px 2px;border-bottom:1px solid var(--line);opacity:0;animation:inFade .8s ease 1.4s forwards}
@keyframes inRule{to{height:clamp(40px,7vh,72px)}}
@keyframes inEyebrow{to{opacity:1;letter-spacing:.32em}}
@keyframes inChar{to{opacity:1;filter:blur(0);transform:none}}
@keyframes inMark{to{width:clamp(80px,12vw,140px)}}
@keyframes inFade{to{opacity:1}}
.intro.out{clip-path:inset(0 0 100% 0)}
.intro.out .in-inner{opacity:0;transform:translateY(-40px)}
html.intro-on, html.intro-on body{overflow:hidden}
@media (max-width:640px){
  .in-br{display:block}
  .in-title{font-size:min(12vw,52px);line-height:1.3}
  .in-title .comma-sp{display:none}
  .in-eyebrow{letter-spacing:.42em}
  @keyframes inEyebrow{to{opacity:1;letter-spacing:.22em}}
}
/* 오프닝 뒤 첫 화면이 이어서 떠오름 */
html.pre-open .hero > *{opacity:0;transform:translateY(16px)}
.hero > *{transition:opacity 1.2s cubic-bezier(.2,.7,.2,1),transform 1.2s cubic-bezier(.2,.7,.2,1)}
.hero > :nth-child(2){transition-delay:.12s}.hero > :nth-child(3){transition-delay:.24s}.hero > :nth-child(4){transition-delay:.36s}
@media (prefers-reduced-motion:reduce){
  .in-title .ch,.in-eyebrow,.in-sub,.in-skip{animation:none!important;opacity:1;filter:none;transform:none}
  .in-rule{animation:none!important;height:56px}.in-mark{animation:none!important;width:120px}
  .intro{transition:opacity .6s}.intro.out{clip-path:none;opacity:0}
}

/* ---------- 오프닝: 밤에서 새벽으로 ---------- */
.intro.i3{background:#070b16;overflow:hidden;--ease:cubic-bezier(.22,.61,.24,1);--slow:cubic-bezier(.65,0,.15,1)}
.intro.i3::after{opacity:.28;mix-blend-mode:screen;z-index:6}
.i3-world{position:absolute;inset:0;transform:scale(1.07);transition:transform 9s cubic-bezier(.25,.1,.25,1)}
.s-sky .i3-world{transform:scale(1)}
.i3-sky{position:absolute;inset:0;background:radial-gradient(130% 90% at 50% 0%,#1b2645 0%,#0f1730 38%,#080d1b 72%,#060912 100%)}
.i3-sky canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 2.4s ease .2s}
.s-sky .i3-sky canvas{opacity:1}
.i3-stars{position:absolute;inset:0}
.i3-stars i{position:absolute;border-radius:50%;background:#fff;opacity:0;transform:scale(.2);box-shadow:0 0 4px rgba(255,255,255,.7),0 0 10px rgba(190,205,255,.25)}
.i3-stars i.big::before,.i3-stars i.big::after{content:'';position:absolute;left:50%;top:50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translate(-50%,-50%)}
.i3-stars i.big::before{width:900%;height:1px}
.i3-stars i.big::after{width:1px;height:900%;background:linear-gradient(transparent,rgba(255,255,255,.55),transparent)}
.s-sky .i3-stars i{animation:i3On 1.6s var(--ease) var(--d) forwards,i3Tw var(--tw) ease-in-out calc(var(--d) + 1.6s) infinite alternate}
@keyframes i3On{0%{opacity:0;transform:scale(.2)}55%{opacity:1;transform:scale(1.35)}100%{opacity:var(--o);transform:scale(1)}}
@keyframes i3Tw{to{opacity:calc(var(--o) * .45)}}
.i3-glow{position:absolute;left:-20%;right:-20%;bottom:-10%;height:70%;opacity:0;transform:translateY(12%);
  background:radial-gradient(60% 55% at 50% 100%,rgba(255,196,150,.75) 0%,rgba(226,150,140,.38) 32%,rgba(120,95,140,.18) 58%,transparent 75%);
  transition:opacity 2s ease,transform 2.6s cubic-bezier(.3,0,.2,1)}
.s-dawn .i3-glow{opacity:1;transform:none}
.i3-ridges{position:absolute;left:0;right:0;bottom:0;width:100%;height:30%;transition:opacity 1.8s ease}
.i3-ridges path{transition:fill 2.4s ease}
.s-dawn .i3-ridges .r0{fill:#3a3550}.s-dawn .i3-ridges .r1{fill:#2b2a40}.s-dawn .i3-ridges .r2{fill:#1e1f31}
.i3-day{position:absolute;left:0;right:0;bottom:0;height:240%;transform:translateY(100%);will-change:transform;
  background:linear-gradient(to top,var(--bg) 0%,var(--bg) 50%,#f2e6da 54%,#efd6c4 58%,rgba(232,186,166,.72) 63%,rgba(196,150,160,.42) 69%,rgba(120,105,150,.18) 77%,rgba(40,45,80,0) 88%);
  transition:transform 2.6s cubic-bezier(.5,0,.18,1)}
.s-day .i3-day{transform:translateY(0)}
.i3-frame{position:absolute;inset:clamp(12px,2.4vw,28px);z-index:4;border:1px solid rgba(255,255,255,0);transition:border-color 2.4s ease .3s;pointer-events:none;
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(10.5px,1vw,12.5px);letter-spacing:.14em;color:rgba(255,255,255,.42)}
.s-sky .i3-frame{border-color:rgba(255,255,255,.1)}
.s-day .i3-frame{border-color:rgba(60,45,30,.12);color:rgba(60,45,30,.45);transition:border-color 1.6s ease 1s,color 1.6s ease 1s}
.i3-frame span{position:absolute;opacity:0;transition:opacity 1.6s ease 1s,color 2s ease}
.s-sky .i3-frame span{opacity:1}
.i3-frame .tl{left:16px;top:12px}.i3-frame .tr{right:16px;top:12px}.i3-frame .bl{left:16px;bottom:12px}
.i3-stage{position:relative;z-index:5;width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:0 16px;transition:opacity 1s ease,transform 1.4s var(--slow)}
.i3-stage > *{grid-area:1/1}
.i3-date{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(52px,9.4vw,132px);line-height:1;letter-spacing:.04em;color:#eef0f7;white-space:nowrap;
  font-variant-numeric:lining-nums tabular-nums;opacity:0;filter:blur(10px);transform:translateY(14px);transition:opacity 1.8s var(--ease),filter 1.8s var(--ease),transform 1.8s var(--ease),text-shadow 1.2s ease}
.s-date .i3-date{opacity:1;filter:none;transform:none}
.i3-date .md{color:rgba(238,240,247,.5);margin-left:.02em}
.i3-date .reel{display:inline-block;height:1em;overflow:hidden;vertical-align:top;
  -webkit-mask-image:linear-gradient(transparent 0,#000 18%,#000 82%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 18%,#000 82%,transparent 100%)}

<body>
<div class="intro i3" id="intro" aria-hidden="true">

<script>
/* 오프닝 — 밤에서 새벽으로 (78년의 시간) */
(function(){
  var html = document.documentElement, el = document.getElementById('intro');
  var seen = false; try{ seen = sessionStorage.getItem('intro-seen') === '1'; }catch(e){}
  var force = /[?&]opening\b/.test(location.search);
  if(!force && (seen || /^#\d+/.test(location.hash) || /[?&](admin|tune)\b/.test(location.search))){ el.parentNode.removeChild(el); return; }
  html.classList.add('intro-on','pre-open');
  var seed = 19481019; function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  var mobile = innerWidth < 700;

  /* 별 35개 (작품 수) — 크기·밝기·켜지는 순서를 조금씩 다르게 */
  var box = document.getElementById('i3Stars');
  var order = []; for(var i=0;i<35;i++) order.push(i); order.sort(function(){ return rnd() - .5; });
  for(var i=0;i<35;i++){
    var st = document.createElement('i'), x = 4 + rnd()*92, y = 4 + rnd()*58;
    if(y > 26 && y < 54 && x > 16 && x < 84) y = y < 40 ? y - 18 : y + 16;
    var big = rnd() < .18, sz = big ? 2.6 + rnd()*1.4 : 1.1 + rnd()*1.5;
    st.className = big ? 'big' : '';
    st.style.cssText = 'left:'+x.toFixed(2)+'%;top:'+y.toFixed(2)+'%;width:'+sz.toFixed(2)+'px;height:'+sz.toFixed(2)+'px;--d:'+(0.3 + order[i]*0.048).toFixed(3)+'s;--tw:'+(2.4 + rnd()*3).toFixed(2)+'s;--o:'+(0.55 + rnd()*0.45).toFixed(2);
    box.appendChild(st);
  }
  /* 아주 옅은 별무리 (깊이감) */
  var cv = document.getElementById('i3Dust'), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  var cx = cv.getContext('2d'); cx.scale(dpr, dpr);
  for(var k=0;k<(mobile ? 140 : 260);k++){
    var px = rnd()*innerWidth, py = rnd()*innerHeight*0.78, r = rnd()*0.8 + 0.2;
    cx.fillStyle = 'rgba(220,228,255,' + (0.05 + rnd()*0.22).toFixed(3) + ')';
    cx.beginPath(); cx.arc(px, py, r, 0, 6.283); cx.fill();
  }
  /* 산 능선 세 겹 */
  var svg = document.getElementById('i3Ridges'), layers = [[270,46,'#121a30'],[300,38,'#0e1528'],[330,30,'#0a1020']], paths = '';
  layers.forEach(function(L, li){
    var base = L[0], amp = L[1], d = 'M0 400 L0 ' + base;
    var n = 9 + li*3, pts = [];
    for(var j=0;j<=n;j++) pts.push([j/n*1600, base - amp*(0.35 + rnd()*0.65) * (li === 0 ? 1.2 : 1)]);
    for(var j=1;j<pts.length;j++){ var p0 = pts[j-1], p1 = pts[j], mx = (p0[0]+p1[0])/2; d += ' Q' + p0[0].toFixed(0) + ' ' + p0[1].toFixed(0) + ' ' + mx.toFixed(0) + ' ' + ((p0[1]+p1[1])/2).toFixed(0); }
    d += ' L1600 ' + pts[pts.length-1][1].toFixed(0) + ' L1600 400 Z';
    paths += '<path class="r' + li + '" d="' + d + '" fill="' + L[2] + '"/>';
  });
  svg.innerHTML = paths;

  /* 1948 → 2026, 숫자판처럼 굴러가는 연도 */
  var yr = document.getElementById('i3Yr'), from = '1948', to = '2026', spins = [0,0,1,2];
  yr.innerHTML = from.split('').map(function(d0, idx){
    var a = +d0, b = +to[idx], seq = [a], cur = a, steps = (b - a + 10) % 10 + spins[idx]*10;
    for(var s=0;s<steps;s++){ cur = (cur + 1) % 10; seq.push(cur); }
    return '<span class="reel"><span class="strip" style="--n:' + (seq.length - 1) + ';--rd:' + (1.35 + idx*0.18).toFixed(2) + 's">' + seq.map(function(x){ return '<b>' + x + '</b>'; }).join('') + '</span></span>';
  }).join('');

  /* 제목 글자 */
  var t = document.getElementById('inTitle'), txt = t.textContent, n = 0, out = '';
  txt.split('').forEach(function(c, k){
    if(c === ' ' && txt.charAt(k-1) === ','){ out += '<span class="sp comma-sp"></span><br class="in-br">'; return; }
    if(c === ' '){ out += '<span class="sp"></span>'; return; }
    out += '<span class="ch" style="--i:' + (n++) + '">' + c + '</span>';
  });
  t.innerHTML = out;

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var done = false, timers = [];
  function at(ms, f){ timers.push(setTimeout(function(){ if(!done) f(); }, ms)); }
  function add(c){ return function(){ el.classList.add(c); }; }
  function finish(){
    if(done) return; done = true; timers.forEach(clearTimeout);
    try{ sessionStorage.setItem('intro-seen','1'); }catch(e){}
    el.classList.add('out'); html.classList.remove('pre-open');
    setTimeout(function(){ html.classList.remove('intro-on'); if(el.parentNode) el.parentNode.removeChild(el); }, 1500);
  }
  function start(){
    if(reduce){ el.classList.add('s-title','s-day'); at(1800, finish); return; }
    requestAnimationFrame(function(){ el.classList.add('s-sky'); });
    at(1000, add('s-date'));
    at(1950, add('s-roll'));
    at(3550, add('s-arrive'));
    at(7900, add('s-title'));
    at(8600, add('s-dawn'));
    at(9250, add('s-day'));
    at(11900, finish);
  }
  if(document.fonts && document.fonts.ready){ var go = false; document.fonts.ready.then(function(){ if(!go){ go = true; start(); } }); setTimeout(function(){ if(!go){ go = true; start(); } }, 1500); } else start();
  el.addEventListener('click', finish);
  document.getElementById('inSkip').addEventListener('click', function(e){ e.stopPropagation(); finish(); });
  window.addEventListener('keydown', function(e){ if(!done && (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); finish(); } });
  window.addEventListener('wheel', function(){ if(!done) finish(); }, {passive:true, once:true});
  window.addEventListener('touchmove', function(){ if(!done) finish(); }, {passive:true, once:true});
})();
</script>

<script>
/* =========================================================
   ① 전시 정보 — 여기만 고치면 상단 문구가 바뀝니다
   ========================================================= */
const EXHIBITION = {
  school:   '순천별량중학교',
  eyebrow:  'Yeosu · Suncheon 10·19 — Poetry Exhibition',
  title:    '한바닥, 오래 남을 이야기',
  titleLa:  '',
  lead:     '순천별량중학교 3학년 학생들이 저마다의 시선으로 여순 10·19를 바라보고 표현한 작품을 모았습니다. 한바닥에 담기에는 너무 긴 이야기여서, 짧은 글에 그림의 언어로 숨결을 불어넣었습니다. 미처 다 담지 못한 이야기는 담벼락 너머에 남겨 두었습니다.',
  facts:    [['기간','2026. 11. 9.(월) ~ 11. 20.(금)'],['장소','순천시청 서관 1층 (민원실과 북카페 사이)'],['참여','순천별량중학교 3학년 학생들']]
};

/* =========================================================
   ② 전시 구성 — 1부 ~ 3부
   ========================================================= */
const PARTS = [
  {id:1, title:'문을 열면, 그날',
   desc:'첫 번째 공간에서는 익숙한 오늘날의 풍경 뒤에 가려진 여순 10·19의 이야기를 발견할 수 있습니다. 학생들의 시선을 따라 여순 10·19 사건 당시로 점점 들어가 볼 수 있습니다.'},
  {id:2, title:'기억의 숲',
   desc:"두 번째 공간에서는 허공에 매달린 시와 그림 사이를 거닐며 여순 10·19의 여러 장면을 마주합니다. 저마다 다른 학생들의 시선이 모여 하나의 '기억의 숲'을 이루고 있습니다. 여러분은 작품 사이에 머물며 미처 쓰이지 않은 이야기를 상상해 보시기 바랍니다."},
  {id:3, title:'담벼락',
   desc:'세 번째 공간에서는 오늘날 우리 곁에, 여전히 아픔을 간직하고 있는 존재의 이야기를 볼 수 있습니다. 평온하게 살아가는 듯 보이는 여러분 주변 누군가의 이야기일 수 있습니다. 그들의 기억을 건너, 현재를 살아가는 여러분의 담벼락에 어떤 사연을 담아가시겠습니까?'},
];

/* =========================================================
   ③ 작품 목록 — 중괄호 { } 한 묶음이 작품 하나입니다
   no     : 작품 번호 (전시장 번호와 같게)
   part   : 몇 부에 전시되는지 (1, 2, 3)
   cls    : 반    author : 학생 이름    title  : 작품 제목
   poem   : 시 본문 (` ` 사이에 그대로 붙여 넣기, 빈 줄은 연 구분으로 나옵니다)
   note   : 작가의 말 (없으면 빼도 됩니다)  예) note:`이 작품은 …`

   파일은 번호로 자동 연결됩니다.
     1번 작품 → works/01.jpg  ,  audio/01.m4a
     12번 작품 → works/12.jpg ,  audio/12.m4a
   확장자가 다르면 image:'works/01.png', audio:'audio/01.mp3' 처럼 직접 적어 주세요.
   사진이 아직 없으면 임시 그림이, 녹음이 없으면 미리보기 재생이 나옵니다.
   작품 수는 목록에 넣은 만큼 자동으로 세어집니다.
   ========================================================= */
const WORKS = [
  {no:1, part:1, cls:2, author:'문시혁', title:'시선',
   poem:`나는 보았다
사람들이 손으로 총을 쏘면
다른 총이 날아온 것을

나는 보았다
사람들을 도와주면
총이 날아온 것을

나는 보았다
말을 하면
총이 날아온 것을

나는 보았다`,
   note:`이 시를 보면 '나는 보았다'라는 구절이 나옵니다. 그래서 저는 눈을 그렸습니다. 이 눈은 아무 이유 없이 죽은 사람들을 보고 있습니다. 사람들을 도와주면 왜 도와줬냐고 죽이는 모습, 말을 하면 죽는 모습, 손으로 사람을 가리키면 죽는 모습. 저는 그 모습들을 낙서처럼 그렸고, 그 위에 목공풀로 다시 그림을 그렸습니다. 목공풀로 다시 그린 이유는 입체감을 주기 위해서입니다.
이 그림에는 그리지 못했지만 아무 이유 없이 죽은 사람들이 많았을 것입니다. 그래서 이 그림의 눈은, 그때 당시 사람들이 빨갱이라서 죽은 게 아니라는 사실을 널리 전해주자는 의미 또한 담고 있습니다.`},
  {no:2, part:1, cls:2, author:'임준우', title:'고무신',
   poem:`탕탕 총소리
털썩 쓰러지는 소리
살려달라 울부짖는 소리
짝과 떨어진 외로움…
나는 침묵 속으로
빠져들어간다.`,
   note:`이 작품은 여순 10·19 그날의 이야기를 담고 있습니다. 이 작품의 시점은 피해자의 고무신 시점입니다. 그래서 작품에 고무신을 그려 넣었습니다. 그 주변에는 라이프지 잡지에 있는 그 당시 사진을 오려서 고무신의 시점을 표현했고, 10·19의 참혹함을 사실적으로 나타냈습니다. 바탕색을 검은색으로 해서 분위기를 무겁고 우울하게 했고, 하얀 고무신에 빨간색으로 피를 표현하여 그 당시 피해자들의 피를 드러냈습니다.
이 시에서는 고무신이 들었던 소리들과 결국 고무신도 시체와 같이 묻히는 걸 표현했습니다. 흘리기와 번지기 같은 표현 방식으로 피를 표현했습니다. 이 시와 그림을 통해 전하고자 하는 메시지는 이 당시 피해자들의 아픔과 슬픔을 왜곡되지 않게 보고 그날을 기억하고자 하는 것입니다.`},
  {no:3, part:1, cls:2, author:'박유리', title:'땅',
   poem:`울려 퍼지는 총소리와
내 몸엔
따뜻한 무언가가 흘러내리오.
내 몸엔
비린내가 진동을 하고
내 몸은 그날에 멈추어
총소리가 울리면 움찔거린다.`,
   note:`저는 여순 10·19를 주제로 시를 적었습니다. 시 제목을 땅으로 정하고 나서 시를 적었습니다. 시 구절 '내 몸에 따뜻한 무언가가 흘러내리오'라는 구절에서 어떻게 표현할지 고민하다가 머리 쪽에 피가 흐르는 듯한 장면이 떠올라 그것을 묘사했습니다. 그림에 검은 종이를 붙여 문을 만들었습니다. 사람은 실루엣으로 표현을 했고, 배경에 총소리가 울리는 듯한 느낌을 주기 위해 총소리를 시각화하여 표현했습니다.`},
  {no:4, part:1, cls:1, author:'한지영', title:'손가락 총',
   poem:`누군가를 향한 손가락 하나
저 사람이라는 한 마디에
얼굴에는 두려움이 가득 찼다.`,
   note:`이 시는 당시의 학교 운동장에서 손가락으로 자신을 도와준 사람을 지목해서, 지목당한 사람이 두려움에 떠는 장면을 (바라보고 있는 사람의 모습을) 보여주고 있습니다. 이 장면은 사람이 두려움에 떠는 장면이기 때문에 작품을 좀 어두운 색으로만 표현을 했습니다. 그리고 작품 속 손은, 지목하는 사람의 손을 그렸는데 디테일을 살리기 위해 주름을 자세히 표현하고 그림자 진 것도 표현을 했습니다. 그리고 작품 종이를 일반 크기가 아닌 긴 종이로 사용을 했습니다. 긴 종이를 사용한 이유는 손가락으로 사람을 가리키는 것을 더 잘 표현할 수 있기 때문입니다. 결국 이 작품을 통해 그때 당시 사건의 잔혹성을 표현하고 싶었습니다.`},
  {no:5, part:1, cls:1, author:'정원석', title:'남은 피와 총알',
   poem:`난 나라를 지킨다
난 사람을 지킨다
난 나라를 망친다
난 사람을 사살한다
난 사람들의 비명을 듣는다
그만
그만
나 때문에 피만 남는다`,
   note:`이 작품은 여순 10·19 사건을 토대로 그린 작품입니다. 이 시에서 볼 수 있듯 총은 사람의 목숨을 지키기도 하고 뺏어가기도 합니다. 시에서 사람들을 죽여서 남은 총알과 피가 남은 걸 표현했습니다. 총은 죽이기 싫어했지만 어쩔 수 없이 (사람을) 죽여야 해서 '그만 그만'이라는 표현을 넣었습니다. 그래서 그림에서 총이 두 개인데 각 총의 색이 다른 이유가, 파란색은 선한 마음을 표현했고, 빨간색은 악한 마음을 표현했습니다.
그리고 그 아래에 깔려 있는 총알과 피는 사람을 죽인 총알과 죽은 사람에게서 나온 피를 표현했습니다. 그리고 총의 테두리를 진하게 그어 입체감을 표현해 주었습니다. 이 시는 총도 죽이고 싶어서 죽인 게 아니라, (누군가에게) 사용되어 사람을 죽일 수밖에 없던 마음이었음을 표현했고, 또한 그 총을 든 군인들의 마음을 (대신) 나타낸 것이기도 합니다.`},
  {no:6, part:1, cls:2, author:'심선주', title:'마을 속',
   poem:`어느 날 사람들이 사라진다.
쓰러져 말 없는 사람들
다가가려는 등 뒤에 들려오는 탕`,
   note:`이 그림은 총 그림과 실루엣을 표현하였습니다. 배경은 피처럼 튀기고 피를 흘리는 것을 표현하였습니다. 색과 형태는 일단 색은 피를 표현한 붉은색, 빨간색을 표현하였습니다. 그리고 형태는 검은 형태를 표현하였습니다. 
제가 살고 있는 마을은 매곡동입니다. 그런데 매곡동에서도 10·19 사건이 일어났기 때문에 이 제목을 '마을 속'이라고 지었습니다. 우리나라에서는 많은 곳에서 10·19 사건이 일어나서 (배우면서) 엄청 무서웠습니다. 그런데 이제는 이런 날이 안 왔으면 좋겠고, 모든 사람들이 이렇게 아픔을 느끼지 않았으면 좋겠습니다.`},
  {no:7, part:1, cls:2, author:'노현수', title:'죄와 벌',
   poem:`뚝뚝`,
   note:`이 작품은 10·19 당시의 희생자의 감정을 표현한 시로, 검은 배경은 희생자의 비참한 마음과 억울함 등이 섞여 있는 감정으로, 여러 색이 섞이면 검은색이 되듯이 여러 감정이 섞여 있어 검은색이 되는 것처럼 하였습니다. 누군가를 가리키는 손은 '없는 죄'를 표현하였고, 손에서 흐르는 피는 '없는 죄'로 인한 억울한 벌이라고 할 수 있습니다. 
시 '뚝뚝'은 두 글자인데, 그 이유는 죽은 자는 억울하여도 고통스러워도, 누군가가 원망스러워도 말을 할 수 없이 피만 흘리기 때문입니다.
저는 그저 10·19의 희생자들이 아무 죄 없이 그 당시 광기의 피해자이고, 이것을 과장이나 왜곡 없이 많은 사람들이 기억해 주길 바라는 마음에서 이 시화를 만들었습니다.`},
  {no:8, part:1, cls:2, author:'정하랑', title:'손',
   poem:`많은 사람들이 죽었소
나의 작디작은 손가락에
나를 치료해준 사람들
나에게 먹거리를 줬던 사람들
나에게 옷을 줬던 사람들
나를 도와줬던 사람들

나의 작디작은 손가락으로
무고한 사람들을 죽였소`,
   note:`손을 많이 넣고 색을 다양하게 넣어 다른 사람, 여러 사람이라는 느낌을 주었습니다. 대각선 모서리에 피를 뿌려 손으로 사람들을 죽인 것을 의미합니다. 시를 살펴보자면 14세 소년의 손가락 지목으로 인해 무고한 사람이 죽은 사건을 (유족의 증언으로) 듣기도 하고 시를 통해 듣기도 했습니다. 특히 소년의 상황과 시점, 생각 등을 나타내었습니다. 
(시의) 마지막 부분에서 '나의 작디작은 손가락으로 무고한 사람들을 죽였소'라는 구절은 나중이 되어서, (손가락으로 지목했던 사람이) 자신의 잘못이나 그 당시의 실수를 후회할 것 같다고 생각을 해서 적었습니다. 
독자에게 전하고자 하는 것은 다시는 이런 일이 반복돼선 안 되고, 여순 10·19에 대해 모르는 사람들은 이 시를 읽고 정확히 알았으면 좋겠고, 14세 소년도 하는 수 없이 (지목을) 했을 수도 있다는 것을 알았으면 좋겠다는 점입니다. 또한 국가는 이를 피하지 말고 진상 규명을 위해 노력하고 법을 실행해 주길 바라는 마음을 담았습니다.`},
  {no:9, part:1, cls:2, author:'박관우', title:'도망',
   poem:`어른들은 왜 모여 있어요?
저만 두고 어른들이 가요
어른들은 저보고 도망가래요
바닥에 놓인 커다란 뭉치는 뭐예요`,
   note:`어른들이 어딘가에 모여 있는 장면을 표현하기 위해서 맨 위쪽에 다리만 그렸고, 검정색으로 칠한 이유는 그때의 분위기를 조금이라도 알리기 위해서입니다. 시 구절 '커다란 뭉치'는 죽은 사람들을 나타내는 것이고, 신문지를 뜯어서 풀로 붙이고 망태에 덮인 시신을 표현했습니다.
시의 주인공인 울고 있는 아이는 어른들이 아이를 혼자 두고 어디론가 가 버려서 서럽게 울고 있습니다. 독자나 관람객에게 전하고자 한 내용은 학교에서 여순 10·19에 대해서 책(여순에 핀 빨간 봉선화(안오일))을 읽었을 때 가장 기억에 남았던 내용이, 마을 사람들이 경찰에게 (왜 죄 없는 사람을 잡아가느냐며) 따지러 가는 내용이었습니다. 아이들은 마을에 남겨지고 어른들의 손가락 총으로 인해 무고한 희생자들이 나왔던 것이 인상 깊어서 시와 그림으로 표현했습니다.`},
  {no:10, part:1, cls:1, author:'신방송', title:'…',
   poem:`학교 운동장 서 있는 사람들
하나 둘 큰 소리가 난다. 탕타탕탕
뒤에서 보고 있던 사람들은
눈에서 붉은 물이 뚝뚝 흐른다.
우리는 아무것도 할 수 없고 아무것도 모른다.`,
   note:`저는 여순 10·19가 이렇게 비참하고 잔혹한 사건인지 (원래는) 잘 몰랐습니다. (수업을 들으며) 여순 10·19 사건이 얼마나 힘든 시기 때 일어나고 잔인하고 잔혹한 사건인지 알았습니다. 그래서 절대 일어나면 안 된다고 생각했습니다. 여순 10·19를 주제로 만든 작품은 두 가지가 있는데요.
그림은 묶여 있는 사람들을 표현하고, 괴물은 군인들을 표현했습니다.
그리고 시는 공개 총살 장면을 보고 있는 유족분들의 모습을 생각해서 시로 지었습니다. 그림은 괴물도 표정이 굉장히 좋지 않은 표정입니다.
그 이유는 군인도 같은 민족을 죽이는 것에 거부감을 느꼈으리라는 생각이 들어 그렇게 표현했습니다.`},
  {no:11, part:1, cls:1, author:'황주원', title:'트라우마',
   poem:`날 지켜주는 사람이 한순간에 사라졌다.
날 품어주던 사람이 한순간에 사라졌다.
나와 함께 놀던 사람이 한순간에 사라졌다.
나를 제외한 나의 모든 것이 한순간에 사라진다.`,
   note:`이 시는 10·19 여순 사건 당시 남겨진 희생자분들의 유족분들이 트라우마를 겪지 않으셨을까 하는 마음에서 쓴 시입니다. 글씨를 조금 날려 써 그때 그 순간을 떠올렸을 때 떨고 불안해하는 감정을 표현하였습니다.
밖에 그려져 있는 사람들은 트라우마를 겪지 말라고 밝은 빛을 내며 화자의 자아를 둘러싸 다가오는 트라우마, 즉 그때의 기억을 막아보려 하는 것을 표현하였습니다. 그러나 그 기억이 너무 충격적인 기억이어서 막는 것에 실패한 것 또한 표현하였습니다. 색은 거칠고 우울을 표현하는 보라색을 사용해 더욱 어두운 분위기를 표현하였습니다. 또한 번지기 기법과 뿌리기 기법, 흘리기 기법 전부를 사용해, 많은 방법으로 마음을 건드린다는 것도 표현하였습니다.`},
  {no:12, part:1, cls:1, author:'박성문', title:'별량면 돌고개',
   poem:`운동산 자락 마을 운천리 대려에서
봉림리 석현으로 넘어가는 교통로
1948년 10월부터 1949년 여순사건
당시 정부의 초토화 토벌 작전에 따라
무고한 주민들의 피해가
큰 지역`,
   note:`저희는 별량면에서 살면서 학교에 다니고 있는데요,
별량에서도 많은 사람이 죽었다고 합니다.
지금 군부대가 위치해 있는 근처에서요.
운동산 아래 운천리에서 봉림리 석현으로 넘어가는 길이 바로 돌고개입니다.
1948년 10월부터 1949년까지,
이곳에서 아무 죄 없는 마을 사람들이 많이 다치고 목숨을 잃었습니다.
우리 동네에 이런 슬픈 일이 있었다는 것을 알리고 싶어서 이 시를 썼습니다.
시 둘레는 파란색 물감으로 칠했습니다.
돌고개를 지날 때, 그날의 사람들을 한 번 떠올려 주면 좋겠습니다.`},
  {no:13, part:1, cls:2, author:'신지율', title:'손가락 그것은 총이었다',
   poem:`나는 왜 여기에 있는가.
이유도 모른 채 있다.
같이 있는 사람들이 손가락질 당한다.
나 또한 손가락질을 당한다.
무슨 일이 생길 것 같아 눈을 세게 감는다.
탕 총소리가 들렸다.
나는 그때 깨달았다.
손가락 그것은 총이었다.`,
   note:`이 작품은 만화 같은 느낌을 주고 싶어 어두운 색감이 아닌 화사한 느낌으로 그렸습니다. 약간 푸른 색감을 사용한 이유는 여순 10·19가 슬픈 사건이지만 그 사람들이 희생당하기 전에는 평화롭고 그림처럼 날씨가 맑았을 것 같아서 이런 색감을 썼습니다. 갈색 실을 밧줄처럼 써서 밧줄에 입체감을 줬습니다. 그리고 손과 총에서 손가락이 나오게 해서 한층 더 만화 같은 느낌을 줬습니다.
시에서 손가락이 총이었다고 나오는데, 그림에서도 손가락에서 손이 나오고, 권총에서도 손이 나오게 해서 둘이 같다는 걸 묘사해 줬습니다.
그때 당시 희생자들이 느꼈던 억울함, 그리고 왜 내가 희생당했는지 모르는 그런 비참함과 그저 손가락일 뿐인데 총이 되어 버리는 그런 잔인함의 메시지를 주고 싶었습니다. 이 시를 읽고 그날 손가락의 무시무시함을 알아줬으면 좋겠습니다.`},
  {no:14, part:1, cls:2, author:'박유은', title:'문',
   poem:`끼이익
문이 열린다.
사람들이 하나 둘 모여든다.
하하호호 달그락 거리며
웃음을 나눈다.

끼이익
문이 열린다.
사람들이 하나 둘 모여든다.
탕탕탕
큰 소리를 내며
공포를 몰아온다.

끼이익
문이 열린다.
모두가 떠나간다.
더 이상
웃음도 공포도
남지 않는다.`,
   note:`이 작품은 그림책 "용맹호(권윤덕)"의 장면 중, 어느 집 문을 열어 일가족을 학살한 후 떠나는 장면에서 영감을 받아 만들게 되었는데요. 이러한 상황에 여순 10·19 사건을 접목시킴으로써 한 가정의 평화를 깨뜨린 사건의 잔혹함을 잔인한 묘사 없이 표현했습니다.
그림은 크게 보았을 때 문이 연상되게 그려냈습니다. 문살은 나무의 질감 등을 표현하기 위해 물감을 사용하였고, 문의 창호지는 그림이 문이라는 느낌을 주기 위해 실제 문에 쓰이는 종이와 비슷한 질감의 한지를 사용하여 표현했습니다. 또한 시가 적혀 있는 부분마다 종이가 찢어져 있는데, 이는 봉기군뿐만 아니라 무고한 사람들까지도 학살한 여순 10·19 사건의 무분별함을, 한 가정의 파탄에 담아내고 이를 구멍 난 창호지를 통해 표현했습니다.
저는 이 작품에서 드러난 죄 없는 사람들의 희생을 통해 여순 10·19 사건의 무분별한 학살과 피해자분들의 억울함을 표현하고자 했으며, 이런 일이 다시 반복되지 않았으면 하는 작은 소망 또한 담아내었습니다.`},
  {no:15, part:1, cls:2, author:'정창민', title:'무죄',
   poem:`맑은 하늘을 볼수록 왜 더 허무해지냐
일상적인 하루를 바라오며 날을 시작하는데
왜 햇빛이 드리운 곳에 이리도 붉은 색이 아리는가
잘못을 인정해도 잘못이 없다 해도
왜 결과는 같은 것이냐
계속해서 나는 그 화약 냄새
그 냄새가 이리 심하게 나는 것이 무슨 이유인가
그 작은 구멍에서 나오는 연기가
내 손을 멈추지 못하게 한다
손에서 나오는 그 온기만이
내 감정을 진정시킨다`,
   note:`시에서는 여순 10·19 당시 상황을 보는 모습입니다. 하지만 화자의 생사는 불확실하게 나와 있습니다. 그림에서 총구 위 눈에는 총에 맞고 피 흘리는 모습의 사람이 보이지만, 이 사람이 화자라는 단서는 없습니다.
죽음을 숨겨 (표현한 이유는), 당시 피해자들 또한 살고 싶어 하셨고, 죽을지도 모른다는 불안에 떨었기에 이를 읽는 독자에게 의문을 만들고 싶었습니다. 그림을 전체적으로 볼 때 총구가 있고 총에 눈이 있는 듯한 모습입니다. 눈을 당시의 가해자로 보았고, 그 눈에는 총에 맞은 사람이 비친 것과 다르게 굉장히 무반응적인 눈빛입니다. 어둡기만 하고 무의미한 학살을 보는 눈이 어떻게 생겼는지 고민해 보았습니다. 그리고 시에서도 누군가의 죽음 또한 직접적으로 언급되지 않았습니다. 대신 '붉은색이 아리는가'로 죽었다는 정황만을 표현하였습니다.`},
  {no:16, part:1, cls:1, author:'이다영', title:'흔적',
   poem:`조금 전까지
누군가의 발을 지켜주던 나를

조금 전까지
누군가와 함께 걷던 나를
이제는 그 누구도 찾아주지 않네`,
   note:`우선 시의 화자인 신발의 형태를 그려 넣었고, 그 신발 안에 사람의 형상을 넣음으로써 이 신발의 주인, 즉 사용자의 실루엣을 연필로 흐릿하게 표현하여 죽은 이를 표현하였습니다. 신발은 군대에서 나누어 준 고무신을 신었다고 처형당한 이들이 있다고 들어서 고무신의 형태로 선택하였습니다. 또한 고무신의 색을 칠할 때 일부러 깔끔하지 않고 더럽혀진 듯한 느낌을 주기 위해 수채화에 번지기를 조금 사용하여 색을 칠했습니다. 배경 또한 어두운 계열의 색으로 번지기를 사용하여 외로운 느낌과 방치된 듯한 느낌, 슬픔 등을 표현하여 시의 구절 중 '이제는 그 누구도 찾아주지 않네'라는 구절을 표현할 수 있도록 하였습니다. 
독자와 관람객에게는 이 시의 주인공인 신발뿐만이 아니라 죽은 이들과 관련된 많은 사람들이 이 신발과 비슷한 상황 상태라는 것을 간접적으로 알려주고 싶었습니다.`},
  {no:17, part:2, cls:1, author:'김해찬', title:'잊혀지지 않는 세월',
   poem:`나무가 한창 자라던 시기
나무는 지옥을 보았다.
여러 명의 사람들이 줄지어 죽은 모습
나무가 자라 나이를 먹어도
그때의 아픔은 잊을 수 없다.`,
   note:`이 시는 여순 사건 당시 막 자라나던 나무가 겪은 세월의 아픔을 시로 나타냈습니다. 잊혀지지 않는 아픔을 표현하기 위해 나무의 색깔을 원래 색깔이 아닌 창백하고 연붉은색으로 표현하였습니다. 잎 색깔은 가을을 나타내기 위해 단풍잎 색깔로 표현했습니다. 나무 아래에는 시신들이 쌓여 있는데, 여순 당시 시신들을 나무 아래 매장한 것을 표현했고, 잊혀지지 않는 아픔의 원인이기도 합니다. 시신 아래에는 흘리기 기법을 사용해 나무가 흘리는 눈물을 표현하였습니다. 
여순 사건 당시 유족들이 겪었을 아픔을 나무라는 사물을 통해 전달하고 싶었습니다. 나무는 오래 살고 한 자리에 계속 있기에 아픔을 더 잘 전달할 것이라고 생각하여 나무를 선택했습니다. 그리고 나무는 말하지 못하기에 오랜 세월 누명 때문에 진실을 얘기하지 못한 유족들의 마음까지 이 시에 담아냈습니다.`},
  {no:18, part:2, cls:1, author:'황도윤', title:'고목의 외침',
   poem:`듣기 싫은 소리들이 나에게 꽂힌다.
오탄들이 나에게 박힌다.

초록 군복을 입은 여우들
흩어지라 소리친다.

경찰모를 쓴 늑대들
잡으라 소리친다.

그로 인해 나 또한 상처를 입는다.
왜 같은 짐승들끼리 싸우는 것일까

결국 잡힌 초록군복 여우들
떨리는 손과 발이 묶인다

탕 하는 소리가 들리자
눈에 초점이 사라지고 붉은 비가 내린다.`,
   note:`이 작품은 나무가 중심입니다. 그리고 이 나무의 색과 느낌, 상처를 미루어 보아 고목인 것을 알 수 있습니다. 그림의 대부분 어두운 색만을 써서 10·19 사건의 분위기를 표현하였습니다. 시에서 '듣기 싫은 소리'와 '오탄들이 나에게 박힌다'는 구절이 있어 나무에 총탄 자국과 상처를 그렸고, 많은 사람들이 죽은 것은 나무의 가지가 잘린 것으로 빗대어 그렸습니다. 두 무리 모두 사람들을 무자비하게 죽이는 모습이 짐승 같다고 느꼈습니다. 그래서 봉기군을 여우로, 진압군을 늑대로 그리며 포식 관계를 나타내었습니다.
그림에 어두운 색으로 번지기를 써서 적은 수의 색으로 여러 색을 나타내었고, 윗부분에는 빨간색으로 흘리기, 아랫부분에는 빨간색으로 뿌리기 기법을 써 피를 나타내었습니다. 이 피들은 나무의 아픔, 즉 사건의 잔혹함을 나타낸 것입니다. 저는 이 시와 그림을 통해 사건의 잔혹함을 나무의 시선으로 표현하였습니다.`},
  {no:19, part:2, cls:2, author:'이루빈', title:'그 노래',
   poem:`노을 진 철길 아래 동천은
울음 소리로 가득했다.
가족을 잃은 사람, 연인을 잃은 사람, 친구를 잃은 사람
그들의 울음소리가 모여 노래가 된다.`,
   note:`여순 10·19 현장 답사에 갔을 때 철도에서 기차가 지나가는 모습과 그 현장의 옛날 모습을 보고 시를 썼습니다. 그 시절의 소중한 사람을 잃은 사람들의 모습과 그 기분을 느끼면서 '그 노래'라는 시를 썼습니다. 철길 아래 동천에서 소중한 사람을 찾고 울부짖는 모습이 상상되어 시와 그림으로 표현했습니다.
그림 아랫부분에서는 무채색과 유채색으로 여순 10·19로 죽은 사람과, 죽은 사람 옆을 지키는 산 사람을 표현했습니다. 노을 진 동천을 표현하고 싶어서 번지기 기법으로 동천에 비친 노을을 표현했고, 철길에서 달리는 기차까지 표현했습니다. 현장에서 이야기를 들을 때 울음소리가 날 것 같다는 생각을 했으며, 상상한 것을 시로도 표현했습니다. 이 시를 보고 관람객이 그날의 모습과 소리 등을 떠올렸으면 좋겠다는 생각도 했습니다.`},
  {no:20, part:2, cls:1, author:'이형주', title:'눈물',
   poem:`샛노란 눈물이
눈앞을 가린다

그해 추석날
단지 딱 하나
이기적인 이유로
그가 떠나갔다

긴 세월을 지나
파란 눈물을 흘리는
사람들에게 말한다

시간이 갈수록
샛노란 빛들이
눈앞을 가린다`,
   note:`이 작품의 그림 중 가장 눈에 띄는 것은 물방울입니다. 여러 사람들에게 말하니 점점 슬픔이 줄어드는 것을 표현하고자 했습니다. 햇살이나 조명에 비춰 노란색으로 변한 눈물과 희망을 표현하고 싶었습니다. 중간중간 동백꽃을 넣어 여순 10·19 사건에 희생된 분들과, 붉은색으로 잔인함을 표현하고자 했습니다. 그림의 아래에서 위로 갈수록 동백꽃을 점점 연하게 하여 시간이 갈수록 바래 가는 꽃잎처럼 점점 나아져 가는 유족분들의 마음을 표현하고 싶었습니다.
제가 독자나 관람객들에게 전하고자 한 내용은 처음에는 유족분들이 여순 10·19 사건에 대해 말씀하실 때 눈물을 흘리며 슬퍼하셨지만, 색이 바래가는 꽃처럼 점점 나아져가는 유족분들의 마음을 표현하고 싶었습니다. 그리고 슬픔을 벗어나기 위해선 주변의 도움이 필요하다는 것도 표현하고 싶었습니다.`},
  {no:21, part:2, cls:2, author:'김바다', title:'아무도 없는 숲속에서',
   poem:`아무도 없는 숲속에서
경찰은 땅을 판다
묻는다
다시 덮는다

꽃잎이 그 위로 떨어진다
피도 살도 꽃도
모두 흙이 된다

비명을 목격한 흙 위에서
나무는 피를 먹고 자란다

아무도 없는 숲속에서
나무는 피를 닮은 붉은 꽃을 낸다

아무도 없는 숲속에서
10월의 잔혹함을 기억한다`,
   note:`아무도 없는 숲속에서는 누군가가 숨겨진 폭력을 지켜보고 있으며, 그 진실은 반드시 드러날 것이라고 노래하는 작품입니다. 아무도 없는 숲속에서 자행된 폭력을 흙이 그대로 흡수하고, 그 위에서 자란 나무는 피를 닮은 꽃을 냅니다. 아무도 없는 숲이지만 결코 아무도 없는 곳이 아닙니다. 흙과 나무, 즉 어떤 것이든 진실을 기억하는 존재는 있고, 언젠가 그것은 떠오를 것입니다. 
작품 속 숲에서 잔혹한 사건이 일어났다는 것이 믿기지 않을 만큼 숲이 평화로워 보이길 바랐습니다. 그러기에 피를 직접적으로 표현하지 않았으며, 아련하고 평화로운 분위기를 조성하기 위해 수채화를 선택했습니다. 아직도 알려지지 않은 진실들이 핏빛의 꽃들처럼 언젠가 피어나길 바라는 마음으로 쓰고 그린 작품입니다.`},
  {no:22, part:2, cls:2, author:'김태균', title:'그 계절',
   poem:`가을 아침 오늘도
바람을 맞이한다.

하지만 오늘은 무엇인가 달랐다.
나는 사람들이 모여 있는 것을
바라 봤다.
그들 주위로
군인들이 움직인다.

총소리가 들려오며
한순간에 나의 나뭇잎들은
재가 되며
겨울이 찾아온다…`,
   note:`이 시는 여순 10·19 사건 때의 시점이고, 가을을 좋아하는 화자가 군인들의 민간인 학살을 목격하면서 겨울이 찾아오는 시입니다. 이 시를 쓰게 된 계기는 가을이라는 계절을 좋아하는데, 당시 여순 10·19 사건 때에도 가을이었다고 생각하기에 이 시를 처음에 '나'라는 화자를 넣어 여러 가지 해석이 되도록 의도했습니다. 화자를 나무로 생각하게 만들기 위해서 그림에 나뭇잎들을 물감에 찍어 표현했습니다. 또 그림으로 이 이야기를 추측할 수 있게 끝에는 나뭇잎이 재가 된 표현을 넣었습니다.
주황, 노랑, 갈색 분위기에서 회색, 검붉은색으로 암울한 분위기를 표현했고, 문장 중에 '나의 나뭇잎들은 재가 되며'를 단순히 나뭇잎이 사라지는 것을 넘어 동포들이 죽어가는 것으로도 표현을 했습니다.
이를 통해 전하고 싶은 내용은 계절이 돌고 돌아오는 만큼, '가을이 되면 단풍이 피겠네'처럼 10월이 되면 '여순 10·19 사건이 있었지.' 하면서 기억해 줬으면 하는 마음입니다.`},
  {no:23, part:2, cls:1, author:'오승주', title:'매국기',
   poem:`나는 투쟁했다.
대한의 국민을 위해서
나는 투쟁했다.
대한민국을 위해서
최선을 다해서
대한의 상징이 되었다.
그러나 나에게 이런 시선을 보내는 너희는
대체 누구야`,
   note:`태극기를 주제로 한 시인 만큼 전체적인 그림의 형태를 태극기로 잡았습니다. 하지만 태극기 의미의 훼손, 왜곡 등을 표현하고 싶어서 콜라주라는 기법을 활용해 찢어진 태극기의 모습을 표현하고 싶었습니다.
원래 태극기의 배경색은 흰색인데 검은색으로 연하게 칠했습니다. 그 이유는 아까 말했던 태극기의 의미의 훼손에 있습니다. 또 건곤감리가 본래와 다르게 표현되었는데 이 또한 태극기 훼손을 확실히 전달하기 위해서입니다. 
그리고 시에 대해서 설명하겠습니다. 시의 제목은 매국기인데 이것에 대해 궁금하신 분들이 많을 것 같아 설명드립니다. 사실 나라를 사랑하는 것을 애국이라고 표현하는데 이것의 반대말은 매국입니다. 나라의 상징인 태극기를 왜곡되게 비튼 것이 싫어서 매국기라고 제목을 지었습니다. 이 시에서 투쟁하는 주체는 여순 10·19 사건의 유족분들이고, 그때 곁에 있어야 했던 것도 태극기입니다.
그런데 권종국 유족님의 이야기를 들으니 국가 폭력을 저지른 나라에 대한 분노 때문에 나라의 상징인 태극기를 경멸하기도 한다는 점이 이해되었습니다. 시에서 이런 시선을 보내는 너희라는 구절은 바로 여순 10·19 사건의 유족을 뜻합니다.`},
  {no:24, part:2, cls:2, author:'양서연', title:'찾아오지 않은 가을',
   poem:`올해도 달은 차오르는데
우리집 가을은 찾아오지 않았다.
어머니는 밥을 짓지 않으셨고
아버지가 계신 자리는 비어 있었다.
나는 대문을 열어 두었다.
혹시나 돌아오는 발소리가 들릴까 봐
마당에는 달빛만 내려 앉고
식지 않은 그리움만 남았다.
달아, 너는 그날의 사람들을 어디까지 비추고 왔니?
올해도 달은 차오르는데
나는 아직도 그 시간에 멈춰 있다.`,
   note:`제목은 찾아오지 않은 가을입니다. 이 작품은 색지를 오려서 붙였고, 이 기법을 사용함으로써 가을의 정서를 드러내고 종이를 오려 선의 깔끔함을 표현하였습니다. 뿌리기 기법으로는 '가을' 하면 생각나는 단풍의 색, 그리고 은행잎의 색, 감나무의 색과 같이 가을을 상징하는 색들로 가을의 밤에 있는 별을 표현하였습니다. 아래에 하나 남은 밥그릇을 두어 가족들이 다 떠나고 혼자 남은 쓸쓸함을 나타내었습니다.
또 이 시의 주제를 가을로 잡은 이유는 유족의 아픔에 공감하며 시를 쓰고 싶어서 여순 10·19가 일어난 계절인 가을로 정했습니다. 그리고 이 시의 화자인 유족이 아직 그때에서 벗어나지 못하고 멈춰 있는 것을 대문과 달로 표현하였습니다. 그 이유는 달과 대문이 그 당시의 상황을 가장 잘 기억하고 있는 요소라 생각했기 때문입니다.
'달아, 너는 그날의 사람들을 어디까지 비추고 왔니'라는 구절에서 그날의 진실을 가장 잘 알고 있는 게 달이라고 생각해서, 달에게 진상 규명을 바라는 것을 나타내었습니다.
이 시를 통해 사람들이 유족의 고통과 슬픔, 그리고 그리움에 공감을 했으면 하는 바람과 함께 여순 10·19가 더 널리 알려졌으면 좋겠다는 마음을 전합니다.`},
  {no:25, part:2, cls:1, author:'양세아', title:'잔상',
   poem:`평생토록 잊혀지지 않는
눈앞에 아른거리는
그의 얼굴`,
   note:`이 시는 여순 10·19 사건 때 누군가를 잃어 슬픔에 빠진 유족의 입장으로 썼습니다. '평생토록 잊혀지지 않는'과 '눈앞에 아른거리는'이라는 구절에서 아직도 그를 잊지 못했다는 것을 표현하고 싶습니다. 시의 제목을 눈에 담는 빛, 잔상이라고 했는데, 그 뜻을 이용해 별과 빛을 그렸습니다. 흩뿌려진 흰색 물감을 별로 표현했고, 또 눈물처럼 보이고 싶어서 미술 시간에 배운 뿌리기 기법을 사용했습니다. 그리고 파란 빛과 노란 빛을 눈물방울과 기억으로 나타냈습니다. 흰색 펜으로 사람의 얼굴의 형태를 따라 그렸는데 유족들이 기억하고, 잊지 않음을 표현하고 싶어서 그렸습니다. 유족분들의 슬픔과 돌아가신 분들을 기억하고 잊지 말자고 독자들에게 전하고 싶었습니다.`},
  {no:26, part:2, cls:2, author:'김재윤', title:'명령',
   poem:`사람들이 죽는다
나의 의지는 아니지만
나에 의해 죽었다.
하지만 괜찮다.
이들은 모두 빨갱이다.
그러니 괜찮을 것이다.`,
   note:`이 시는 여순 10·19의 군인들 중에서 명령과 자신의 행동에 대하여 혼란스러워하는 사람들도 있지 않았을까라는 생각으로 써본 시입니다. 시의 내용이 명령과 자신의 행동에 대하여 혼란스러워하는 내용이므로 혼란스러워하는 군인의 생각을 표현하기 위해서 색깔을 다양하게 섞어서 혼란스러워하는 마음을 잘 표현할 수 있는 마블링 기법을 사용하였고, 또 너무 같은 색들만 있으면 혼란스러워하는 생각이 너무 단순하게 표현될 수 있을 것 같다고 생각해서 마블링 한 종이를 마구 붙여 혼란스러운 색 형태 분위기를 최종적으로 표현하였습니다.
제가 이 시와 그림으로 전하고자 한 내용은 저 시절의 군인들 모두가 절대 악으로 표현되어야 할 만큼 나쁜 존재인가에 대한 생각입니다.`},
  {no:27, part:3, cls:2, author:'나경은', title:'가을 무게',
   poem:`내가 주황빛을 나타낼 때
이들은 문을 열고 반긴다.
내가 떨어질 때면
이들은 날 사진 앞으로 보낸다.
반기는지 알았던 얼굴은
… …

가장 풍족한 나날들에
가장 조촐하게 보내는 이들에게`,
   note:`시에서 화자가 감인데 감의 시선으로 시를 이야기함으로써 제사상의 모습을 떠올리게 했고, 제사상 그림을 넣어 이해를 도왔습니다. 또 수채화를 사용한 이유는 향토적인 모습과 뭉글한 느낌, 익숙한 분위기를 내기 위해서입니다. 배경에 푸른색을 쓴 이유는 슬픔과 무거운 분위기를 내기 위해서입니다. (그림의) 상차림은 가득한데 시 구절에서는 '가장 풍족한 나날들을 가장 조촐하게 보내는 이들에게'로 반대되는 분위기를 내어 쓸쓸함을 강조하였습니다.
제가 이 작품을 그리고 만들게 된 계기는 여순 10·19 때 추석쯤에 사람들이 아무 죄도 없이 총을 맞고 억울하게 죽은 후 남은 유가족분들의 생을 인터뷰한 영상을 본 것입니다. 당시 인터뷰에서 추석 때가 되면은 대부분 제사를 지내고 있어서, 추석이라는 모두가 풍족하고 행복하게 보내는 날들에 유족분들은 힘들고 조촐하게 보낸다는 이야기를 들었습니다. 이 이야기를 널리 알리고 싶고, 이런 슬픈 일이 있었다는 걸 많은 사람들이 기억해 줬으면 하는 마음입니다.`},
  {no:28, part:3, cls:2, author:'박윤슬', title:'시월',
   poem:`동천에 찾아와 버린 추운 바람
아, 벌써 가을이 오려나 봐요

어린 나무 데려가는 검은 발자국
울음 그친 아이 위로 슬피 우는 손
공허한 두 눈, 얼핏 비친 붉은 꽃잎

난 그저 흘러만 가요.
그때도, 지금도.`,
   note:`이 시는 10월 그날의 참담한 사실을 비유적으로 아름답게 표현한 시입니다. 시에 상반되게 어딘가 무서운 바탕 그림은 사실을 명시하는 눈이 가장 큰 포인트입니다. 회색의 어스름을 헤엄치는 듯한 짝 없는 눈들은 그날을 잊지 않고 있다고 말하는 우리를 (나타내고), 밑에 간간이 떠오르는 호박 빛들은 노을이 지고 있는 풍경을 간접적으로 나타냅니다. 
무겁고 암담한 상황 속에서도 여전히 흘러만 가는 무심한 자연을 표현하고 싶다는 바람으로부터 채색하게 되었습니다. 이 작품은 간절히 외칩니다. 잊지 않는 눈들이 영원히 물속에 잠겨버리기 전에 어서 사실을 인정하고 더 나아가 세상을 옳게 바꾸어 달라고요.`},
  {no:29, part:3, cls:1, author:'이승원', title:'강',
   poem:`그날
총소리와, 시취와, 핏자국이
모든 것이
내게 담긴다.
담겨 흐른다.
흘러 남는다.
가라앉는다.
오늘 나의 밑바닥엔
그날이 고여 있다.`,
   note:`동천 옆 제방에 시체가 널려 있었다는 이야기를 들었을 때 동천에게도 이러한 상처가 남았을 거라는 생각이 들었습니다. 그래서 그림에서 이러한 상처를 표현하고 싶었습니다. 수채화를 사용하여 물의 질감을 주고자 하였고, 번지기 기법을 활용하여 물의 느낌을 강조하였습니다. 색은 단순히 밝은 색이 아니라 청회색 계열의 어두운 느낌이 있는 색을 활용하여 시의 어둡고 슬픈 분위기를 표현하고자 하였습니다. 추가로 흰색으로 뿌리기 기법을 활용하여 기포를 표현하였습니다. 그림의 하단에는 오일 파스텔을 이용해 어떠한 덩어리를 그렸습니다. 배경과 다른 재료를 사용하여 강조하였고, 짙은 색을 사용하여 묵직한 느낌을 주었습니다. 이 덩어리는 시 마지막 연에 있는 '고여 있는 그날'을 나타냅니다.
그래서 앞서 말한 방법으로 무겁고 답답한 느낌을 주었습니다. 이 그림에서는 강 밑바닥에 고여 있는 그날의 모습을 통해 아직도 남아 있을 상처를 표현하고자 하였습니다.`},
  {no:30, part:3, cls:2, author:'장선웅', title:'동천',
   poem:`동천에 갔다.
물이 흐르고 새가,
사람도 많다.
기차도 지나고 있었다.
예전에는 사람들이
쓰러져 있는 곳이었는데….`,
   note:`저는 친구들과 함께 여순 역사 기행을 하며 순천 동천에 가 보았는데요,
동천에는 물이 흐르고, 새가 많고, 사람도 많았습니다.
기차도 지나가고 있었습니다.
아름답고 평화로운 모습이었어요.
그런데 여순 10·19 때 이곳은 사람들이 쓰러져 있던 곳이었다고 합니다.
그래서 그림 위쪽에는 지금의 동천을,
아래쪽에는 쓰러진 사람들과 군인들을 그렸습니다.
지금은 평화로운 동천에 예전에는 슬픈 일이 있었다는 것을 기억해 주세요.`},
  {no:31, part:3, cls:1, author:'이수연', title:'거리',
   poem:`당시 둘러싸진 망태로 가득한 그 거리
온 세상이 핏빛으로 가득 차 있어 보였지.

나는 이 거리를 걷는다.
북적북적한 소리들이 귓속을 가득 채우고
푸른 빛들이 보이지

여전히 나는 하염없이 그곳을 바라본다.`,
   note:`거리라는 시는 당시 동천의 거리와 지금 동천의 거리를 비교하여 보여주고 있는 시입니다. 그래서 첫 연에는 당시 과거의 모습, 그리고 두 번째 연에서는 오늘의 모습을 보여주고 있습니다. 
시를 바탕으로 동천을 배경으로 그림을 그렸습니다. 당시부터 지금까지 계속하여 흐르고 있는 동천은 번지기로 표현하였습니다. 하지만 배경은 여순 당시에 초점을 맞춰, 동천에 널브러져 있던 시체들을 그림으로 표현하고 어두운 보라색을 사용하며 당시의 아픔과 어둡고 암울하던 것을 표현했습니다. 그리고 이 동천을 바라보고 있는 사람을 표현했는데, 단순한 검정색이 아니라 배경색과 비슷한 보라색을 사람 안쪽에 섞어 그려서 현재의 동천을 보고 있지만 그 당시가 떠오르며 복잡하고 암울한 감정들이 떠오르는 모습을 표현했습니다. 이러한 것들을 통해서 유족들의 아픔이 지금까지도 이어져 있고 그에 이어서 회복까지 이어져야 한다는 것을 전하고 싶었습니다.`},
  {no:32, part:3, cls:1, author:'장다윤', title:'나무',
   poem:`경찰들이 마을 사람들을 잡아갔다
사람들의 울음소리만이 들려온다
마을에 어린 아이들만 남아있다`,
   note:`이 작품은 여순 10·19 사건 당시 주요 학살지 중 하나인 낙안면 신전마을을 배경으로 하여 그 마을에 남겨진 나무의 모습과, 대부분의 사람들이 잡혀가서 텅 비어버린 마을을 표현했습니다. 밤 시간대의 고요하고 쓸쓸한 분위기를 연출하기 위해 수채화 물감을 이용했습니다. 
추석 즈음의 날짜를 배경으로 하여 즐겁고 화목해야 할 추석이지만 낙안 신전마을에 찾아온 비극으로 인해, 더 이상 웃음소리를 들을 수 없는 쓸쓸함을 나타냈고, 커다란 나무가 한쪽으로 흩날리는 것처럼 하여 불안정한 마을의 분위기를 나타내고 싶었습니다.`},
  {no:33, part:3, cls:1, author:'임연우', title:'깨진 평화',
   poem:`1948년 10월 어느 날

그 사건은 10·19 사건
여수·순천 시민들이 학살당했다.
잊지 않겠다.
평화롭게 살자.`,
   note:`1948년 10월 어느 날의 이야기의 내용을 바탕으로 지어낸 시입니다. 피 묻은 옷과 동백꽃은 희생자의 독립적인 의미입니다. 그리고 평화가 깨지고 공포스러운 전쟁이 시작되면서 시민들은 목숨을 잃고 어떻게 할지 고민하고 있습니다. 그 사건은 많은 사람들이 희생하고 부상당한 아픈 역사를 담고 있는 사건입니다. 앞으로도 그날을 기억할 것입니다. 이 작품은 피 묻은 옷과 희생자의 고무신과 동백꽃으로 표현한 작품입니다.`},
  {no:34, part:3, cls:1, author:'김에녹', title:'낡은 시계',
   poem:`어느 날부터인가 아버지가 안 보이기 시작했다.

아직도 어디에 계신지 모르겠다.
도대체 어디에 계실까?`,
   note:`저의 시는 권종국 유족분의 이야기를 듣고 감동을 받아서 쓴 시입니다.

시의 내용을 해석하면, 어느 날부터 아버지가 안 보이기 시작했다는 것을 알게 된 아들의 시점으로 쓴 시입니다. 낡은 시계를 강조하기 위해 가죽 시계로 그렸고, 스트랩은 가죽 느낌이 나게끔 무늬를 그렸습니다.
일부러 어두운 분위기를 나타내고 싶어서 스트랩을 연필로 약하게 칠했습니다. 마지막으로 깨진 유리를 표현했습니다.`},
  {no:35, part:1, cls:1, author:'오연우', title:'서쪽 제방', online:true,
   poem:`10월 20일 오전에 시내로
진입하려는 봉기군과 막으려는
경찰 사이에 교전이 벌어진 곳`,
   note:`이 시와 그림은 서쪽 제방에서 희생된 사람들과 가족을 잃은 사람들을 표현하고 있습니다. 빨간색 총과 보라색 총은 여순 10·19 당시 목숨을 잃은 사람들을 의미하고, 파란색 총과 초록색 총은 그 사건으로 상처를 입은 사람들이 평화롭고 행복한 삶을 살기를 바라는 마음을 표현했습니다. 이곳에서 일어난 일과, 이유 없이 총에 맞아 숨진 사람들, 그리고 유가족분들을 잊지 않고 기억해야 합니다.`},

const audio = $('audio');
const TUNE = /[?&]tune\b/.test(location.search);
const P = {w:null, seg:'poem', playing:false, demo:false, t:0, raf:0, timer:null, pendingSeek:null};
const demoDur = w => w.lines.length*5 + 4;
const hasNote = w => !!(SPLIT[w.no] && SPLIT[w.no][2] != null);
function totalDur(w){ if(P.w === w && !P.demo && audio.duration) return audio.duration; return SPLIT[w.no] ? SPLIT[w.no][3] : demoDur(w); }
function bounds(w, seg){
  if(P.w === w && P.demo) return [0, demoDur(w)];
  const D = totalDur(w), sp = SPLIT[w.no];
  if(!sp) return [0, D];
  if(seg === 'note' && sp[2] != null) return [sp[2], D];
  return [0, TUNE ? D : (sp[2] != null ? sp[1] : D)];
}
function loadTrack(w, seg){
  seg = seg || 'poem';
  cancelAnimationFrame(P.raf); clearInterval(P.timer);
  if(P.w === w && !P.demo){ audio.pause(); P.playing = false; P.seg = seg; seekAbs(bounds(w,seg)[0]); ui(); return; }
  audio.pause();
  Object.assign(P, {w, seg, playing:false, t:0, demo:false, pendingSeek:null});
  if(w.audio){ audio.src = w.audio; audio.load(); P.t = bounds(w,seg)[0]; P.pendingSeek = P.t; }
  else { P.demo = true; P.seg = 'poem'; audio.removeAttribute('src'); }
  ui();
}
function seekAbs(t){
  P.t = t;
  if(P.demo) return;
  if(audio.readyState >= 1){ try{ audio.currentTime = t; }catch(e){} P.pendingSeek = null; } else P.pendingSeek = t;
}
function tick(){
  if(!P.playing || P.demo) return;
  P.t = audio.currentTime;
  const [, e] = bounds(P.w, P.seg);
  if(P.t >= e - 0.02){ audio.pause(); P.t = e; ended(); return; }
  ui(); P.raf = requestAnimationFrame(tick);
}
function startDemo(){
  clearInterval(P.timer); P.playing = true;
  P.timer = setInterval(() => { P.t += .25; const [,e] = bounds(P.w,'poem'); if(P.t >= e){ P.t = e; ended(); } ui(); }, 250);
}
function fallbackDemo(){
  if(P.demo) return;
  P.demo = true; P.seg = 'poem'; P.t = 0;
  toast('아직 녹음 파일이 없어 미리보기로 재생합니다');
  startDemo(); ui();
}
function playTrack(){
  if(!P.w) return;
  const [s0, e0] = bounds(P.w, P.seg);
  if(P.t >= e0 - .1 || P.t < s0 - .05) seekAbs(s0);
  if(P.demo){ startDemo(); }
  else {
    P.playing = true;
    audio.play().then(() => { cancelAnimationFrame(P.raf); P.raf = requestAnimationFrame(tick); }).catch(fallbackDemo);
  }
  ui();
}
function pauseTrack(){ P.playing = false; clearInterval(P.timer); cancelAnimationFrame(P.raf); audio.pause(); ui(); }
function ended(){ P.playing = false; clearInterval(P.timer); cancelAnimationFrame(P.raf); ui(); }
function toggle(w, seg){
  if(w && (P.w !== w || (seg && seg !== P.seg))){ loadTrack(w, seg || (P.w === w ? P.seg : 'poem')); playTrack(); return; }
  P.playing ? pauseTrack() : playTrack();
}
function seek(ratio){
  const [s0, e0] = bounds(P.w, P.seg);
  seekAbs(s0 + ratio*(e0 - s0)); ui();
}
audio.addEventListener('loadedmetadata', () => { if(P.pendingSeek != null){ try{ audio.currentTime = P.pendingSeek; }catch(e){} P.pendingSeek = null; } ui(); });
audio.addEventListener('timeupdate', () => { if(!P.demo && !P.playing){ P.t = audio.currentTime; ui(); } });
audio.addEventListener('ended', () => { if(!P.demo){ P.t = audio.duration; ended(); } });
audio.addEventListener('error', () => { if(P.w && P.w.audio && !P.demo && P.playing) fallbackDemo(); });

function bindSeek(track, getW){
  track.addEventListener('click', e => {
    const w = getW(); if(!w) return;
    if(P.w !== w) loadTrack(w, 'poem');
    const r = track.getBoundingClientRect();
    seek(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)));
    if(!P.playing) playTrack();
  });
}

/* 낭독 중인 줄 계산: 글자 수에 비례해 시간을 나눔 */
function lineAt(w, t){
  const sp = SPLIT[w.no];
  if(!P.demo && sp && sp[4]){
    if(t < sp[0] - 0.1) return -1;
    let idx = -1;
    sp[4].forEach((x,i) => { if(x != null && t >= x - 0.12) idx = i; });
    return idx;
  }
  const start = 0, end = demoDur(w);
  const wts = w.lines.map(l => l ? l.replace(/[^가-힣0-9A-Za-z]/g,'').length + 3 : 0);
  const sum = wts.reduce((a,b) => a+b, 0) || 1;
  let acc = start;
  for(let i=0;i<wts.length;i++){ acc += (end - start) * wts[i] / sum; if(t < acc && wts[i]) return i; }
  return w.lines.length - 1;
}

function ui(){

<script type="module">
/* 방명록 「당신의 한바닥」 — Firebase 연결 */
const V = '10.12.2', BASE = `https://www.gstatic.com/firebasejs/${V}/`;
try{
  const [{ initializeApp }, fs] = await Promise.all([import(BASE + 'firebase-app.js'), import(BASE + 'firebase-firestore.js')]);
  const { getFirestore, collection, addDoc, serverTimestamp, query, where, limit, onSnapshot, getDocs, doc, updateDoc, deleteDoc } = fs;
  const app = initializeApp(GUESTBOOK.firebase);
  const db = getFirestore(app);
  const col = collection(db, 'notes');
  const toNote = d => { const x = d.data(); return { id: d.id, text: x.text, name: x.name, work: x.work || 0, approved: !!x.approved, ms: x.createdAt && x.createdAt.toMillis ? x.createdAt.toMillis() : 0 }; };
  const byNew = (a, b) => b.ms - a.ms;
  let auth = null, A = null;
  async function authMod(){ if(!A){ A = await import(BASE + 'firebase-auth.js'); auth = A.getAuth(app); } return A; }
  window.HANBADAK = {
    async add({ text, name, work }){
      const ref = await addDoc(col, { text, name, work, approved: false, createdAt: serverTimestamp() });
      return ref.id;
    },
    watch(cb, onErr){
      return onSnapshot(query(col, where('approved', '==', true), limit(300)), snap => cb(snap.docs.map(toNote).sort(byNew)), onErr);
    },
    async all(){ const snap = await getDocs(query(col, limit(1000))); return snap.docs.map(toNote).sort(byNew); },
    async moderate(id, act){
      const ref = doc(db, 'notes', id);
      if(act === 'del') return deleteDoc(ref);
      return updateDoc(ref, { approved: act === 'ok' });
    },
    async login(){ const m = await authMod(); return m.signInWithPopup(auth, new m.GoogleAuthProvider()); },
    async logout(){ const m = await authMod(); return m.signOut(auth); },
    async onAuth(cb){
      if(!/[?&]admin\b/.test(location.search)) return;
      const m = await authMod(); m.onAuthStateChanged(auth, u => cb(!!u));
    }
  };
  window.dispatchEvent(new Event('hanbadak-ready'));
}catch(err){
  console.warn('방명록 연결 실패', err);
  window.dispatchEvent(new Event('hanbadak-failed'));
}
</script>
